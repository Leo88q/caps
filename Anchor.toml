[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/localnet/**/*.ts"

# Local validator (docs/06 §3.5): clone Metaplex Core and the Pyth receiver
# program from mainnet. Switchboard On-Demand is deliberately NOT cloned — there
# is no TEE oracle on localnet, so `randomness_reveal` would never happen and the
# devnet queue key (EYiA…) does not even exist under the mainnet program id
# (SBond…; devnet uses Aio4…). Programs are built with `--features localnet`,
# which points SB_PROGRAM_ID at the tiny `sb_mock` program loaded at genesis
# (same discriminator/layout as RandomnessAccountData, instant `reveal(value)`).
[test]
startup_wait = 20000

[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"   # mpl-core

[[test.validator.clone]]
address = "rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ"    # pyth receiver


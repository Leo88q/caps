[package]
name = "chip-game"
version = "0.1.0"
description = "Chip collecting game: packs, rarity, upgrades, marketplace, staking"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chip_game"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
switchboard-v2 = "0.4.0"
mpl-token-metadata = "4.1.2"

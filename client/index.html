    <!-- No web-font link here, and that is not an oversight: ops/deploy/nginx.conf ships
         font-src 'self' data: and style-src 'self' 'unsafe-inline', so a Google Fonts <link> is a
         render-blocking request the production CSP blocks anyway — a third-party call carrying the
         visitor's IP on every page load, in exchange for nothing. Self-host instead: the recipe (which
         woff2 files, which subsets, the @font-face block) is client/public/fonts/README.md. Until then
         theme.css falls back to cursive/sans/mono, i.e. exactly what prod was already rendering. -->

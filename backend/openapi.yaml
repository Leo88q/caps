        tokenPool: { type: object, properties: { tvlMicro: { type: string }, totalWeight: { type: string }, budgetTodayMicro: { type: string }, apyByTier: { type: array, items: { type: number } } } }
        chipPool: { type: object, properties: { stakedChips: { type: integer }, totalWeight: { type: string }, budgetTodayMicro: { type: string }, dailyPerWeightUnit: { type: string } } }
    StakingMe:
      type: object
      properties:
        tokenStakes: { type: array, items: { type: object, properties: { tier: { type: integer }, amount: { type: string }, weight: { type: string }, pending: { type: string }, unlockAt: { type: string, format: date-time }, earlyExitPenalty: { type: string } } } }
        chipStakes: { type: array, items: { type: object, properties: { chip: { $ref: '#/components/schemas/Chip' }, weight: { type: string }, pending: { type: string }, since: { type: string, format: date-time } } } }
        setBonus: { type: object, properties: { onChainSets: { type: integer }, computedSets: { type: integer }, multBps: { type: integer }, syncPending: { type: boolean } } }
        totalPendingMicro: { type: string }
        pendingEstimated: { type: boolean }
    Quest:
      type: object
      properties: { id: { type: string }, cadence: { type: string }, title: { type: string }, description: { type: string }, metric: { type: string }, target: { type: integer }, value: { type: integer }, rewardCgMicro: { type: string }, rewardChip: { type: [object, 'null'] }, rewardBooster: { type: integer }, completedAt: { type: [string, 'null'] }, claimable: { type: boolean, description: 'done and waiting for the next reward root' }, rooted: { type: boolean }, creditedCgMicro: { type: [string, 'null'], description: 'micro-$CG actually credited after daily/weekly caps' }, ineligibleReason: { type: [string, 'null'] }, resetsAt: { type: [string, 'null'], format: date-time } }
    ClaimLeaf:
      type: object
      properties: { kind: { type: integer, description: '2 quests · 3 PvP season · 4 events ($CG, minted from emission) · 5 quests · 6 season · 7 events (SKR, prize pool)' }, epoch: { type: integer }, currency: { type: string, enum: [CG, SKR] }, rootPda: { $ref: '#/components/schemas/Pubkey' }, amountMicro: { type: string }, proof: { type: array, items: { type: string } }, root: { type: string }, claimableAt: { type: [string, 'null'], format: date-time }, claimed: { type: boolean }, published: { type: boolean }, memo: { description: 'which quests / matches the leaf pays' } }
    SkrPool:
      type: object
      properties:
        fundedTotalMicro: { type: string }
        withdrawnTotalMicro: { type: string }
        paidTotalMicro: { type: string }
        reservedMicro: { type: string, description: 'budget locked in live (non-revoked) roots minus what was already claimed' }
        budgetMicro: { type: string, description: 'funded − withdrawn − paid − reserved; what new roots can still draw' }
        maxRootBudgetMicro: { type: [string, 'null'] }
        paused: { type: boolean }
        roots: { type: array, items: { type: object, properties: { kind: { type: integer }, epoch: { type: integer }, budgetMicro: { type: string }, claimedMicro: { type: string }, revoked: { type: boolean }, slot: { type: integer } } } }
        funding:
          type: object
          description: Treasury funding policy audit — realised SKR revenue (opened packs, settled SKR sales' treasury fee part, SKR services) × published shares (15 / 10 / 5 %) vs. what was actually funded

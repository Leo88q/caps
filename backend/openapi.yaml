        rd: { type: number }
        league: { type: integer }
        games: { type: integer }
        wins: { type: integer }
        streak: { type: integer }
        rewardedMatchesLeft: { type: integer }
        seasonRank: { type: [integer, 'null'] }
        projectedBracket: { type: [string, 'null'] }
        season: { type: integer }

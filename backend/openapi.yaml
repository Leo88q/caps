    Round:
      type: object
      description: 'effA = chipPower × synergyA × (1 + elementEdge) × luckA; effB = chipPower × synergyB × luckB; luck ~ U[0.5, 1.5] from the seed'
      properties: { lane: { type: integer }, attacker: { type: string }, defender: { type: string }, elementEdge: { type: number }, luckA: { type: number }, luckB: { type: number }, effA: { type: integer }, effB: { type: integer }, winner: { type: string } }

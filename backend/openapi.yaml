        brackets: { type: array, items: { type: object, properties: { topPct: { type: number }, sharePct: { type: number } } } }
        serverSecretHash: { type: string }
        serverSecret: { type: [string, 'null'] }
        previous: { type: [object, 'null'], properties: { id: { type: integer }, serverSecretHash: { type: string }, serverSecret: { type: [string, 'null'] } } }
        weeks: { type: integer }
        chipRewardByLeague: { type: array, items: { type: string } }
        soulboundDays: { type: integer }
    StakingOverview:
      type: object

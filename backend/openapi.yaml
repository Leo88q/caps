        currentMatch: { type: [object, 'null'], properties: { id: { type: string }, opponent: { type: string }, iRevealed: { type: boolean }, revealDeadline: { type: string, format: date-time } } }
        queue: { type: [object, 'null'], properties: { ticket: { type: string }, league: { type: integer }, joinedAt: { type: string, format: date-time } } }
        recent: { type: array, items: { type: object, properties: { id: { type: string }, opponent: { type: string }, won: { type: boolean }, forfeit: { type: boolean }, reward: { type: string }, endedAt: { type: [string, 'null'] } } } }
        pendingRewardMicro: { type: string, description: 'match rewards not yet in a published root' }
    Season:

# CI — docs/06 §3.1 pyramid, backlog #16.
#
# PR / push jobs (fast, no chain):
#   economy   invariants + golden vectors + Rust↔TS↔client sync-check
#   client    typecheck · vitest · vite build
#   backend   typecheck · vitest (sqlite in-memory)
#   landing   rebuild guttercaps-landing.html, diff against the committed file, numbers vs economy, DOM smoke
#   programs  cargo fmt / clippy / test + `anchor build` in the pinned Anchor container (first real build of the
#             programs — blocking since docs/09 §3.3 (a red on-chain build fails the PR)
#   localnet  the 77-scenario LiteSVM suite (tests/localnet) on the artifacts of `programs`
#
# Nightly (schedule): the same plus the e2e-devnet / fuzz-long / load-smoke placeholders from §3.1 — they
# stay opt-in (`workflow_dispatch`) until the devnet keys (T-D-03/T-D-04) exist.
name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # nightly UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  ANCHOR_VERSION: 0.31.1
  SOLANA_VERSION: 2.1.21
  # keep vitest / node quiet and deterministic
  CI: 1
  FORCE_COLOR: 0

jobs:
  economy:
    name: economy · invariants + golden + sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run economy:check
      - run: npm run economy:test

  client:
    name: client · typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # the OpenAPI types must be in sync with backend/openapi.yaml (regenerate + diff)
      - name: openapi types up to date
        run: |
          cd client && npx openapi-typescript ../backend/openapi.yaml -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts || { echo '::error::client/src/api/schema.d.ts is stale — run: cd client && npx openapi-typescript ../backend/openapi.yaml -o src/api/schema.d.ts'; exit 1; }
      - run: npm --prefix client run typecheck
      - run: npm --prefix client test
      - run: npm --prefix client run build
      # docs/06 §1.3 budget (≤ 350 KB gzip on the critical path) — a number with no owner drifted to 518 KB
      - run: npm run bundle:check
      - uses: actions/upload-artifact@v4
        with: { name: client-dist, path: client/dist, retention-days: 7 }

  e2e:
    name: e2e · built app (mock API) + axe
    runs-on: ubuntu-latest
    env:
      # Playwright's postinstall would download browsers during `npm ci`; the job installs them in its own
      # step so the dependency install stays cacheable and the browser build is pinned by one command.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # The mock build is the point: the tier must exercise the *production bundle* (entry graph,
      # modulepreload list, router) with no chain and no backend to be accountable for.
      - run: npm run e2e:build
      # Specs are TypeScript that nothing else typechecks; a typo in a selector that only runs nightly is
      # exactly what this catches for free.
      - run: npm run e2e:types
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results/, retention-days: 7 }

  backend:
    name: backend · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm --prefix backend run typecheck
      - run: npm run backend:test
      # the localnet specs import the client builders — typecheck them here (no binaries needed)
      - run: npx tsc -p tests/localnet --noEmit
      # every operation in backend/openapi.yaml has a route, and every route is documented (docs/09 §4.7)
      - run: npm run api:check
      # every env var the code reads is documented in the matching .env.example, both directions
      - run: npm run env:check
      # backend/prisma/schema.prisma (Postgres target) vs the DDL that actually runs: divergence is allowed
      # only if it is listed in backend/prisma/drift.json, and the list may shrink but never grow (docs/09 §4.1)
      - run: npm run schema:check
      # the compose build-arg gate's own cases (scripts/deploy-build-env.ts) — they read the real compose
      # file, so a required `${VAR:?}` that nothing documents fails here rather than in a docker layer
      - run: npm run ops:buildenv -- --selftest
      # `${{ steps.*.outputs.* }}`, `vars.*` and dispatch inputs that resolve to "" — the failure mode of
      # images.yml is publishing an image named after an empty string, so the refs are gated, not eyeballed
      - run: npm run workflows:check

  landing:
    name: landing · build + check + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: rebuild and diff the committed landing
        run: |
          npm run landing:build
          git diff --exit-code -- guttercaps-landing.html || { echo '::error::guttercaps-landing.html is stale — run: npm run landing:build'; exit 1; }
      - run: npm run landing:check

  programs:
    name: programs · fmt + clippy + test + anchor build
    runs-on: ubuntu-latest
    # Blocking since docs/09 §3.3: a red on-chain build must fail the PR. The compile pass itself is
    # described in docs/08 §4.1 (the code has never been built) and lands as a PR against this job.
    container:
      image: solanafoundation/anchor:v0.31.1
    steps:
      - uses: actions/checkout@v4
      - name: toolchain versions
        run: |
          rustc --version && cargo --version && solana --version && anchor --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      # docs/09 §1.4: a verifiable build is only reproducible with a committed lockfile. Until G-0 produces
      # one, CI generates it and hands it to you as an artifact instead of pretending the build is pinned.
      - name: Cargo.lock is committed (reproducible + verifiable builds)
        run: |
          if [ -f Cargo.lock ]; then
            cargo generate-lockfile
            git diff --exit-code -- Cargo.lock || { echo '::error::Cargo.lock is stale — commit the regenerated file'; exit 1; }
            echo "lockfile present and in sync"
          else
            cargo generate-lockfile
            echo '::warning::Cargo.lock is not in the repo (docs/09 §1.4) — commit the generated file after the first build'
          fi
      - name: dependency graph report (one anchor-lang; solana-program v2+v3 is by design)
        # A diagnostic, deliberately demoted from a gate — both halves of that sentence matter. A second
        # anchor-lang in the graph really would break the build: its derive macros generate code against its
        # own traits, so `AnchorSerialize` from one tree does not satisfy the other (docs/09 §1.2). But
        # `cargo tree` here has no committed Cargo.lock to resolve against (docs/09 §1.4), and a check whose
        # exit code measures the shell as much as the graph is not a check: the first version of this step
        # failed the PR on the *intended* solana-program v2/v3 split (mpl-core 0.12.1 needs ^3, anchor-lang
        # 0.31.1 needs ^2, bridged by `features2.anchor = [dep:solana-program-2, …]`), and the second died
        # with exit 2 before printing anything. `anchor build` below is the authoritative answer and stays
        # blocking; re-promote this step once Cargo.lock is committed and the graph is reproducible.
        run: |
          tree=$(mktemp)
          err=$(mktemp)
          if cargo tree -d --workspace >"$tree" 2>"$err"; then rc=0; else rc=$?; fi
          if [ "$rc" != 0 ]; then
            echo "::notice::no duplicate-dependency report here (cargo tree exit $rc) — vacuous until Cargo.lock is committed"
            sed -n '1,4p' "$err" | sed 's/^/note: /'
          elif [ ! -s "$tree" ]; then
            echo "ok: cargo tree found no duplicated packages"
          else
            grep -E '^(anchor-lang|anchor-spl|anchor-client|solana-program|borsh) v' "$tree" | sort -u | sed 's/^/duplicate group: /'
            n=$(grep -cE '^anchor-lang v' "$tree" || true)
            if [ "${n:-0}" -gt 1 ]; then
              echo "::warning::${n} anchor-lang versions in the graph — the build below decides whether that is survivable"
            else
              echo "anchor-lang: not duplicated"
            fi
          fi
          rm -f "$tree" "$err"
          exit 0
      - name: fmt
        # Blocking on purpose. If this is red, do not "fix" it with a laptop rustfmt (different version,
        # different output): run `npm run programs:fmt`, or merge the PR that .github/workflows/format.yml
        # opens from this exact image (nightly + dispatch).
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --workspace
      - name: anchor build (localnet feature → sb_mock id pinned)
        run: |
          mkdir -p target/deploy
          cp tests/localnet/fixtures/sb_mock-keypair.json target/deploy/
          anchor build -- --features localnet
          ls -la target/deploy/*.so
      - name: deployed keypairs derive the declared ids (docs/09 §2)
        run: |
          for p in chip_core market staking arena; do
            if [ ! -f target/deploy/$p-keypair.json ]; then echo "no keypair for $p (placeholder deploy) — see npm run program-ids -- new"; fi
          done
          npm run program-ids -- check
      - name: IDL + program ids match Anchor.toml
        run: |
          for p in chip_core market staking arena sb_mock; do
            want=$(grep -E "^$p\s*=" Anchor.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            have=$(solana address -k target/deploy/$p-keypair.json)
            echo "$p: $have (Anchor.toml $want)"
            if [ "$p" != "sb_mock" ] && [ "$have" != "$want" ]; then echo "::warning::$p keypair id != Anchor.toml (run anchor keys sync before deploying)"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: program-binaries
          path: |
            target/deploy/*.so
            target/idl/*.json
            target/types/*.ts
          retention-days: 7

  localnet:
    name: localnet · 77 scenarios (LiteSVM)
    runs-on: ubuntu-latest
    needs: programs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: program-binaries, path: target }
      - name: third-party fixtures (mpl-core from mainnet, cached)
        uses: actions/cache@v4
        id: fixtures
        with:
          path: tests/localnet/fixtures/mpl_core.so
          key: mpl-core-CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d-v1
      - if: steps.fixtures.outputs.cache-hit != 'true'
        run: RPC_URL=${{ secrets.MAINNET_RPC_URL || 'https://api.mainnet-beta.solana.com' }} npm run localnet:fixtures
      - name: run suite
        run: npm test
      # docs/09 §3.3 — the false green: `describe.skipIf(!bins.ok)` used to report success with 0 tests
      # executed. helpers/env.ts now throws in CI, and this guard catches any future way of skipping the
      # whole suite (bad artifact, empty junit) without touching the specs.
      - name: the suite really ran
        run: |
          f=target/localnet-junit.xml
          [ -f "$f" ] || { echo "::error::no junit report produced"; exit 1; }
          tests=$(grep -oE 'tests="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+')
          files=$(grep -c "<testsuite " "$f")
          echo "localnet: $tests tests in $files suites"
          if [ "${tests:-0}" -lt 77 ]; then echo "::error::expected >= 77 localnet scenarios, got ${tests:-0}"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: localnet-junit, path: target/localnet-junit.xml, if-no-files-found: ignore, retention-days: 14 }

  lighthouse:
    name: nightly · lighthouse (mock build)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Non-blocking until a human has seen it green twice: sizes in this run are deterministic, timings on a
    # shared runner are not (lighthouserc.cjs says which is which and why only the first may gate).
    continue-on-error: true
    runs-on: ubuntu-latest
    env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # lighthouserc.cjs measures what `vite preview` serves, so the build is part of the measurement —
      # without this step lhci starts a preview server over an empty client/dist and scores nothing.
      - run: npm run e2e:build
      - name: chrome path
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
          if [ -z "$chrome" ]; then echo '::error::no Chrome on the runner — lighthouse cannot run here'; exit 1; fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        with: { name: lighthouse, path: test-results/lighthouse, retention-days: 14, if-no-files-found: ignore }

  security:
    name: security · npm audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # Production tree only. Flips to a hard failure once the 6 high advisories from docs/09 §5.6 are gone
      # (they all come in through @switchboard-xyz/on-demand / @solana/spl-token, so it is an upstream bump).
      - name: npm audit (prod tree)
        run: |
          npm audit --omit=dev --audit-level=high | tee audit.txt
          if grep -qE "[0-9]+ (high|critical)" audit.txt; then echo "::warning::prod dependencies carry high-severity advisories — see SECURITY.md"; fi
          npm audit --omit=dev --audit-level=critical
      - name: no committed keypairs outside tests/localnet/fixtures
        run: |
          hits=$(git ls-files | grep -E '(-keypair|keypair|id)\.json$' | grep -v '^tests/localnet/fixtures/' || true)
          if [ -n "$hits" ]; then echo "::error::keypair files committed:"; echo "$hits"; exit 1; fi

  # ---------------------------------------------------------------- nightly / manual (need devnet keys — T-D-03/04)
  e2e-devnet:
    name: nightly · devnet smoke (T-D)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: devnet reachability + program accounts (read-only; needs DEVNET_RPC_URL)
        env:
          RPC: ${{ secrets.DEVNET_RPC_URL }}
        run: |
          if [ -z "$RPC" ]; then echo '::notice::DEVNET_RPC_URL not set — devnet smoke skipped (T-D-03/T-D-04 pending)'; exit 0; fi
          for id in GCRhrg6mc7zH1VdXG5rX3tQEpgu8Gptf27vdsJGV7G8q GCA2aUeX7ZFbGz3zvjqvsbjD1G3QjWxLhBpK5jwwPdcz GCuGx7fnLcKnw1NWU4dLzQvnJWggMVniQ4u7EuMaQevA GCfERiohebYDJLtNwAZpGxudwbXRqnxmuTT413fkTYrM; do
            curl -sf "$RPC" -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getAccountInfo\",\"params\":[\"$id\",{\"encoding\":\"base64\"}]}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(process.argv[1], r.result&&r.result.value? "deployed ("+r.result.value.owner+")" : "NOT DEPLOYED")})' "$id"
          done
          # a full T-D pass (setup DRY_RUN + crank/oracle health) is wired once the devnet payer exists:
          DRY_RUN=1 ANCHOR_PROVIDER_URL="$RPC" npm run setup || echo '::warning::setup dry-run failed (expected until G-0 keys exist)'

  load-smoke:
    name: nightly · load smoke (LT-1 @ 10 %)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # A single API node will miss the 5 000 rps half of the profile — that is the point of the note in
    # scripts/load/README.md ("one node gives a lower bound, not a failed gate"), and why this is advisory
    # until a staging stand with two replicas + Redis exists (docs/09 §4.1–4.3).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --omit=dev
      - name: start the API (no chain, no ingest — LT-1 measures the read path)
        run: |
          PORT=8787 DB_PATH=$(mktemp -d)/lt.sqlite LOG_LEVEL=error API_INGEST=0 EVENT_BUS=off \
            nohup node --no-warnings=ExperimentalWarning --import tsx backend/src/serve.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do sleep 1; curl -sf http://127.0.0.1:8787/healthz >/dev/null && break; done
          # /healthz (process) is the gate, not /readyz: readiness asks for projections, a fresh Pyth cache
          # and a bounded slot lag — none of which exist on a chainless load stand, and a 503 there is the
          # documented, correct answer. Print it so the log shows *why*, and prove a read route answers.
          echo "readyz (advisory on this stand): $(curl -s http://127.0.0.1:8787/readyz | head -c 200)"
          curl -sf http://127.0.0.1:8787/v1/packs | head -c 120 >/dev/null || { echo '::error::/v1/packs did not answer'; tail -40 /tmp/api.log; exit 1; }
      - name: session for the /me profile
        run: |
          node scripts/load/login.mjs > /tmp/cookie
          echo "K6_SESSION=$(cat /tmp/cookie)" >> "$GITHUB_ENV"
      - name: k6 LT-1 (10 % of the profile, 3 min plateau)
        run: |
          docker run --rm -i --network=host -v "$PWD:/s" \
            -e K6_BASE_URL=http://127.0.0.1:8787/v1 -e K6_SESSION="$K6_SESSION" \
            -e K6_READ_RPS=500 -e K6_RAMP_S=20 -e K6_PLATEAU_S=180 \
            grafana/k6:latest run /s/scripts/load/lt1.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: k6-lt1, path: k6-lt1.json, retention-days: 14, if-no-files-found: ignore }

  # LT-3: the indexer's recovery cost. `backend/test/replay.test.ts` proves a rebuild lands on the same
  # state as a live index; this job proves it is *cheap enough to be the answer* during an incident, on a
  # 250k-event deterministic history. Blocking at night (not on PRs — a fixture walk is ~1 min of CPU) and
  # with a floor ~18× under what the box measures, so a runner under load cannot flake it while an
  # accidental O(n²) in a projection handler does.
  replay:
    name: nightly · LT-3 indexer replay (250k events)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: rebuild throughput + projection invariants on a synthetic history
        env: { LT3_EVENTS: '250000', LT3_MIN_EVENTS_PER_S: '2000' }
        run: npm run load:lt3
      - name: the same history through the correctness tier (wider corpus than the PR gate)
        run: npm --prefix backend run test -- test/replay.test.ts

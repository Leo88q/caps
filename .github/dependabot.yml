# Supply-chain upkeep (docs/09-production-readiness.md §5.6). The repo had no automation at all:
# 23 advisories (6 high) in the production npm tree sat untracked while `npm run verify` stayed green.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 8
    groups:
      solana:
        patterns: ["@solana/*", "@coral-xyz/*", "@switchboard-xyz/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    labels: [dependencies]

  # Cargo.lock is not committed yet (docs/09 §1.4) — this becomes useful the moment G-0 lands.
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 5
    ignore:
      # the anchor/solana pair is pinned deliberately (Anchor.toml [toolchain]); bump them together
      - { dependency-name: "anchor-lang", update-types: ["version-update:semver-major"] }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: "Etc/UTC" }
